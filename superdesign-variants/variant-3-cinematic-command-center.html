<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RITTY AI | COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=clash-display@400,600&f[]=satoshi@400,700&display=swap');

      :root {
        --accent: #00f2ff;
        --accent-glow: rgba(0, 242, 255, 0.4);
        --bg-deep: #02040a;
      }

      body {
        margin: 0;
        background-color: var(--bg-deep);
        color: #e2e8f0;
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%
        );
        background-size: 100% 4px;
        z-index: 50;
        pointer-events: none;
        opacity: 0.3;
      }

      .glass-panel {
        background: rgba(13, 17, 23, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }

      .hud-border {
        position: relative;
      }
      .hud-border::before, .hud-border::after {
        content: '';
        position: absolute;
        width: 15px;
        height: 15px;
        border-color: var(--accent);
        pointer-events: none;
      }
      .hud-tl::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
      .hud-tr::before { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
      .hud-bl::before { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
      .hud-br::before { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

      .glow-text {
        text-shadow: 0 0 10px var(--accent-glow);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
      }

      @keyframes pulse-soft {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.4; }
      }
      .animate-pulse-soft { animation: pulse-soft 3s infinite ease-in-out; }

      #chatLog article {
        animation: slideIn 0.3s ease-out forwards;
      }
      @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body class="h-screen overflow-hidden bg-[#02040a]">
    <div class="scanlines"></div>
    
    <!-- Background Ambience -->
    <div class="fixed inset-0 z-0 overflow-hidden">
      <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-cyan-900/10 rounded-full blur-[120px] animate-pulse-soft"></div>
      <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-900/10 rounded-full blur-[120px] animate-pulse-soft"></div>
    </div>

    <div class="relative z-10 flex flex-col h-screen p-4 gap-4">
      <!-- Top Header HUD -->
      <header class="flex items-center justify-between px-6 py-3 glass-panel rounded-xl border-cyan-500/20">
        <div class="flex items-center gap-4">
          <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_var(--accent-glow)] animate-pulse"></div>
          <h1 class="font-['Clash_Display'] text-xl font-semibold tracking-widest glow-text text-cyan-400">RITTY_OS v4.2</h1>
        </div>
        <div class="hidden md:flex items-center gap-8 text-[10px] uppercase tracking-[0.2em] text-cyan-400/60 font-mono">
          <span>LATENCY: 24MS</span>
          <span>SECURE_CONNECTION: ACTIVE</span>
          <span id="systemClock">00:00:00 UTC</span>
        </div>
        <div class="flex items-center gap-3">
          <button id="settings-btn" class="p-2 hover:bg-cyan-500/10 rounded-lg transition-colors">
            <iconify-icon icon="lucide:settings-2" class="text-xl text-cyan-400"></iconify-icon>
          </button>
          <div class="w-10 h-10 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">
            <iconify-icon icon="lucide:user" class="text-xl text-cyan-400"></iconify-icon>
          </div>
        </div>
      </header>

      <!-- Main Content Grid -->
      <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-0">
        
        <!-- Visual Observation Panel -->
        <aside class="lg:col-span-5 xl:col-span-4 flex flex-col gap-4 min-h-0">
          <div class="flex-1 glass-panel rounded-2xl overflow-hidden relative hud-border hud-tl hud-tr hud-bl hud-br group" id="visualPanel">
            <!-- HUD Overlays -->
            <div class="absolute top-4 left-4 z-20 flex flex-col gap-1">
              <div class="bg-black/60 px-2 py-1 rounded text-[10px] font-mono text-cyan-400 border border-cyan-500/30 backdrop-blur-md">
                LIVE_FEED: SIGGY_01
              </div>
              <div class="bg-black/40 px-2 py-0.5 rounded text-[8px] font-mono text-white/50">
                32.8441° N, 117.1517° W
              </div>
            </div>

            <div class="absolute bottom-4 right-4 z-20">
              <div class="flex flex-col items-end gap-1">
                <div class="flex gap-1">
                  <div class="w-1 h-3 bg-cyan-400"></div>
                  <div class="w-1 h-3 bg-cyan-400/60"></div>
                  <div class="w-1 h-3 bg-cyan-400/30"></div>
                </div>
                <span class="text-[8px] font-mono text-cyan-400 uppercase">Synch_Rate: 98%</span>
              </div>
            </div>

            <!-- Video Stack -->
            <div class="w-full h-full relative">
              <video id="idleVideo" class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline>
                <source src="/media/idle" type="video/mp4" />
              </video>
              <video id="reactionVideo" class="absolute inset-0 w-full h-full object-cover hidden" muted playsinline preload="auto">
                <source src="/media/reaction" type="video/mp4" />
              </video>
              <div class="reaction-overlay absolute inset-0 hidden pointer-events-none bg-cyan-400/20 mix-blend-overlay" id="reactionOverlay"></div>
            </div>
          </div>

          <!-- Status Cards -->
          <div class="grid grid-cols-2 gap-4">
            <div class="glass-panel p-3 rounded-xl border-cyan-500/10">
              <div class="text-[10px] font-mono text-cyan-400/60 uppercase mb-1">Energy Core</div>
              <div class="flex items-center gap-2">
                <div class="flex-1 h-1.5 bg-cyan-900/40 rounded-full overflow-hidden">
                  <div class="w-4/5 h-full bg-cyan-400 shadow-[0_0_8px_var(--accent-glow)]"></div>
                </div>
                <span class="text-xs font-mono">80%</span>
              </div>
            </div>
            <div class="glass-panel p-3 rounded-xl border-cyan-500/10">
              <div class="text-[10px] font-mono text-cyan-400/60 uppercase mb-1">Processing</div>
              <div class="flex items-center gap-2">
                <div class="flex-1 h-1.5 bg-blue-900/40 rounded-full overflow-hidden">
                  <div class="w-1/3 h-full bg-blue-400"></div>
                </div>
                <span class="text-xs font-mono">32%</span>
              </div>
            </div>
          </div>
        </aside>

        <!-- Chat Terminal Panel -->
        <main class="lg:col-span-7 xl:col-span-8 flex flex-col glass-panel rounded-2xl overflow-hidden hud-border hud-tr hud-br border-cyan-500/10">
          <!-- Command Toolbars -->
          <section class="px-4 py-3 border-b border-white/5 flex flex-wrap gap-2" id="commandRow">
            <button data-command="/askritty What is Ritual?" id="cmd-ask" class="group flex items-center gap-2 px-3 py-1.5 rounded-lg bg-cyan-500/5 border border-cyan-500/20 hover:border-cyan-400 hover:bg-cyan-500/10 transition-all text-xs font-mono text-cyan-400">
              <iconify-icon icon="lucide:terminal" class="group-hover:animate-pulse"></iconify-icon>
              /askritty
            </button>
            <button data-command="/artritual" id="cmd-art" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all text-xs font-mono text-white/70">
              <iconify-icon icon="lucide:palette"></iconify-icon>
              /artritual
            </button>
            <button data-command="/team" id="cmd-team" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all text-xs font-mono text-white/70">
              <iconify-icon icon="lucide:users-2"></iconify-icon>
              /team
            </button>
            <button data-command="/ritualrandom" id="cmd-rand" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all text-xs font-mono text-white/70">
              <iconify-icon icon="lucide:shuffle"></iconify-icon>
              /ritualrandom
            </button>
          </section>

          <!-- Chat Message Feed -->
          <section class="flex-1 overflow-y-auto p-6 flex flex-col gap-6 custom-scrollbar" id="chatLog" aria-live="polite">
            <!-- Messages will be injected here via app.js -->
          </section>

          <!-- Input System -->
          <div class="p-4 bg-black/40 border-t border-white/5">
            <form id="chatForm" class="flex items-end gap-3 glass-panel p-2 rounded-xl border-cyan-500/20 focus-within:border-cyan-400/50 transition-colors">
              <div class="flex-1 min-w-0">
                <textarea id="chatInput" 
                  class="w-full bg-transparent border-none focus:ring-0 text-sm py-2 px-3 text-cyan-50 resize-none min-h-[44px] max-h-[120px] custom-scrollbar placeholder:text-cyan-500/30"
                  placeholder="INITIATE COMMAND SEQUENCE..."
                  rows="1"></textarea>
              </div>
              <button type="submit" id="sendBtn" 
                class="flex items-center justify-center w-11 h-11 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)] group">
                <iconify-icon icon="lucide:send" class="text-xl group-hover:scale-110 group-active:scale-95 transition-transform"></iconify-icon>
              </button>
            </form>
            <div class="mt-2 px-1 flex justify-between items-center">
              <span class="text-[8px] font-mono text-cyan-400/40 uppercase">Encrypted Peer-to-Peer Tunnel Active</span>
              <span class="text-[8px] font-mono text-cyan-400/40 uppercase">Tokens: 1,402 Available</span>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- System JS Bridge (Inject original app.js logic) -->
    <script src="/app/app.js" type="module"></script>
    <script>
      // Simple clock for the HUD
      function updateClock() {
        const now = new Date();
        const time = now.toISOString().split('T')[1].split('.')[0] + ' UTC';
        document.getElementById('systemClock').textContent = time;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Simple auto-resize for textarea
      const textarea = document.getElementById('chatInput');
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
      });
    </script>
    <style>
      /* Overriding some standard message styles to fit the command center theme */
      .msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        line-height: 1.5;
        font-family: 'Space Grotesk', sans-serif;
      }
      .msg.user {
        align-self: flex-end;
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #fff;
      }
      .msg.bot {
        align-self: flex-start;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
      }
      .sources {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #22d3ee;
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px dashed rgba(34, 211, 238, 0.2);
      }
      .quiz-options button {
        background: rgba(34, 211, 238, 0.1) !important;
        border: 1px solid rgba(34, 211, 238, 0.3) !important;
        color: #22d3ee !important;
        transition: all 0.2s;
      }
      .quiz-options button:hover {
        background: rgba(34, 211, 238, 0.2) !important;
        border-color: #22d3ee !important;
      }
    </style>
  </body>
</html>
